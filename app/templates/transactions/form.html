{% extends 'base.html' %}{% block title %}{{ 'Edit' if transaction else 'Add' }} transaction | Smart Expense Tracker{% endblock %}{% block content %}<main class="auth-shell"><section class="auth-card"><p class="eyebrow">MONEY MOVEMENT</p><h1>{{ 'Edit' if transaction else 'Add' }} transaction</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>Transaction type</label><select class="form-control" name="type"><option value="expense" {% if (transaction and transaction.type == 'expense') or (not transaction and request.form.get('type','expense') == 'expense') %}selected{% endif %}>Expense</option><option value="income" {% if transaction and transaction.type == 'income' or request.form.get('type') == 'income' %}selected{% endif %}>Income</option></select></div><div class="field"><label>Amount</label><input class="form-control" type="number" min="0.01" step="0.01" name="amount" value="{{ transaction.amount if transaction else request.form.get('amount','') }}" required></div><div class="field"><label>Category</label><select class="form-control" name="category_id" required>{% for category in categories %}<option value="{{ category.id }}" {% if transaction and transaction.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></div><div class="field"><label>Description</label><input class="form-control" name="description" value="{{ transaction.description if transaction else request.form.get('description','') }}" required></div><div class="field"><label>Date</label><input class="form-control" type="date" name="date" value="{{ transaction.date if transaction else request.form.get('date','') or today }}" required></div><div class="field"><label>Payment method</label><input class="form-control" name="payment_method" value="{{ transaction.payment_method if transaction else request.form.get('payment_method','') }}" placeholder="Cash, debit card..." required></div><div class="field"><label>Notes</label><textarea class="form-control" name="notes">{{ transaction.notes if transaction else request.form.get('notes','') }}</textarea></div><button class="button button-primary full-width" type="submit">Save transaction</button></form></section></main>{% endblock %}
