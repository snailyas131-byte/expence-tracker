{% extends 'base.html' %}{% block title %}Settings{% endblock %}{% block content %}<main class="auth-shell"><section class="auth-card"><p class="eyebrow">PREFERENCES</p><h1>Settings</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>Name</label><input class="form-control" name="name" value="{{ current_user.name }}" required></div><div class="field"><label>Email</label><input class="form-control" value="{{ current_user.email }}" disabled></div><div class="field"><label>Theme</label><select class="form-control" name="theme"><option value="light" {% if current_user.theme == 'light' %}selected{% endif %}>Light</option><option value="dark" {% if current_user.theme == 'dark' %}selected{% endif %}>Dark</option></select></div><button class="button button-primary full-width">Save settings</button></form></section></main>{% endblock %}
